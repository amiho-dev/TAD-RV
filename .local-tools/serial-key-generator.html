<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAD-RV Local Serial Generator</title>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #1b2733;
      --line: #2d3f52;
      --text: #e8eef5;
      --muted: #9ab0c4;
      --accent: #20b486;
    }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: linear-gradient(120deg, #101822, #111f2f 60%, #163647);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(760px, 100%);
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 16px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select, button, textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f1a24;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea { min-height: 92px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      background: linear-gradient(90deg, #1f8f6c, var(--accent));
      color: #082216;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .secondary {
      background: #172330;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
    @media (max-width: 740px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>TAD-RV Local Serial Generator</h1>
    <p>Nur lokal verwenden. Diese Datei ist absichtlich aus Git ausgeschlossen.</p>

    <section class="grid">
      <div>
        <label for="edition">Edition</label>
        <select id="edition">
          <option value="ADMIN">ADMIN</option>
          <option value="CLIENT">CLIENT</option>
          <option value="DC">DC</option>
        </select>
      </div>
      <div>
        <label for="seats">Seats</label>
        <input id="seats" type="number" min="1" value="30">
      </div>
      <div>
        <label for="customer">Customer</label>
        <input id="customer" type="text" value="SCHOOL-LAB">
      </div>
      <div>
        <label for="expiry">Expiry (YYYYMMDD)</label>
        <input id="expiry" type="text" value="20271231">
      </div>
      <div class="full">
        <label for="serial">Generated Serial</label>
        <textarea id="serial" readonly></textarea>
      </div>
    </section>

    <div class="row">
      <button class="btn" id="gen">Generate</button>
      <button class="secondary" id="copy">Copy</button>
    </div>
    <div class="hint">Hinweis: Dieses Tool erstellt lokale Operator-Serien im Format fuer interne Tests.</div>
  </main>

  <script>
    function randChunk(len) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      crypto.getRandomValues(new Uint32Array(len)).forEach(v => s += chars[v % chars.length]);
      return s;
    }

    function checksum(input) {
      let x = 0;
      for (let i = 0; i < input.length; i++) x = (x + input.charCodeAt(i) * (i + 3)) % 997;
      return String(x).padStart(3, '0');
    }

    function generate() {
      const edition = document.getElementById('edition').value;
      const seats = String(Math.max(1, Number(document.getElementById('seats').value || 1))).padStart(3, '0');
      const customer = (document.getElementById('customer').value || 'LOCAL').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10).padEnd(4, 'X');
      const expiry = (document.getElementById('expiry').value || '20271231').replace(/[^0-9]/g, '').slice(0, 8).padEnd(8, '0');
      const body = `${edition}-${customer}-${seats}-${expiry}-${randChunk(5)}${randChunk(5)}`;
      const out = `${body}-${checksum(body)}`;
      document.getElementById('serial').value = out;
    }

    document.getElementById('gen').addEventListener('click', generate);
    document.getElementById('copy').addEventListener('click', async () => {
      const txt = document.getElementById('serial').value;
      if (!txt) return;
      await navigator.clipboard.writeText(txt);
    });

    generate();
  </script>
</body>
</html>
